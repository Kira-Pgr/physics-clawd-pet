# Builds the Windows installer and the macOS DMG, running all tests first.
# Every run uploads the installers as workflow artifacts (download them from the run's Summary page).
# Pushing a tag like v1.2.0 also creates a draft GitHub Release with the installers attached;
# bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json first.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # tag builds create the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: macOS
            os: macos-latest
            # One app for both Apple silicon and Intel Macs
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend checks
        run: |
          npm run typecheck
          npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          # Only version tags publish anything: a draft release to review and publish by hand
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Clawd Pet {0}', github.ref_name) || '' }}
          releaseDraft: true
