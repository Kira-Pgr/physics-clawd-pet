<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dots · Four little companions</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #101318; color: #f4f2ee; font: 15px/1.5 system-ui, sans-serif; padding: 40px; }
      header { max-width: 1400px; margin: 0 auto 24px; }
      h1 { margin: 0; font-size: 36px; letter-spacing: -1.4px; }
      header p { color: #9ba6b6; margin: 5px 0; }
      #gallery { max-width: 1400px; margin: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
      article { border: 1px solid #303743; border-radius: 24px; overflow: hidden; background: #181e27; }
      h2 { margin: 20px 22px 0; font-size: 18px; }
      .stage { background: radial-gradient(ellipse at 50% 58%, #2d3644, #181e27 70%); position: relative; }
      canvas { display: block; width: 100%; height: auto; }
      .label { font-size: 12px; color: #9ba6b6; margin: 4px 22px 12px; }
      .small { background: #12171e; border-top: 1px solid #303743; }
      footer { max-width: 1400px; margin: 26px auto 0; font-size: 13px; color: #9ba6b6; }
      @media (max-width: 800px) { #gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <header><h1>Dots · Four little companions</h1><p>Short, rounded silhouettes · Soft layered fur · Drawn live by the desktop pet engine</p></header>
    <main id="gallery"></main>
    <footer>Fan-made skins · Cloud, frog, onigiri &amp; bunny · Physics, activities and agent status integration retained.</footer>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
